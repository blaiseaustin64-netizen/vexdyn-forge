name = "vexdyn-forge-deploy"
main = "worker.js"
compatibility_date = "2024-11-01"

# Set secrets (never commit tokens):
#   npx wrangler secret put CF_API_TOKEN
#   npx wrangler secret put CF_ACCOUNT_ID
#
# Optional:
#   npx wrangler secret put DEPLOY_CORS_ORIGIN
#
# Deploy:
#   npx wrangler deploy
#
# Then set in Forge frontend .env:
#   VITE_DEPLOY_API_URL=https://vexdyn-forge-deploy.<your-subdomain>.workers.dev
